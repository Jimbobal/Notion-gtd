<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTD">
<title>GTD for Notion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>

<!-- Setup: connect Notion, choose a parent page, create or adopt the databases -->
<section id="setup" class="setup" hidden></section>

<!-- App shell -->
<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar"></aside>
  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-row">
        <button id="btn-menu" class="icon-btn menu" aria-label="Menu">☰</button>
        <h2 id="view-title">Inbox</h2>
        <div class="topbar-actions">
          <button id="btn-search" class="icon-btn" aria-label="Search">⌕</button>
          <button id="btn-sync" class="icon-btn" aria-label="Sync">⟳</button>
          <button id="btn-add" class="icon-btn add" aria-label="Capture">＋</button>
        </div>
      </div>
      <div id="sync-line" class="sync-line"></div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <nav id="tabbar" class="tabbar"></nav>
</div>

<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></section>
<div id="toast" class="toast" hidden></div>

<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
